name: webp-tray release

# Triggered by pushing a tag like `webp-tray-v0.1.0`. You can also kick
# a build manually from the Actions tab without publishing.
on:
  push:
    tags:
      - "webp-tray-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the MSI (no leading 'v'). Build only — no GitHub release is published."
        required: true
        default: "0.0.0"

permissions:
  contents: write   # needed to create the GitHub release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: webp-tray
        shell: pwsh
    env:
      # Where the runner-side decoded PFX will land. Picked up by sign\sign.ps1.
      WEBP_TRAY_SIGN_PFX: ${{ github.workspace }}\webp-tray\sign\release.pfx
      WEBP_TRAY_SIGN_PFX_PASSWORD: ${{ secrets.WEBP_TRAY_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/webp-tray-v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/webp-tray-v',''
          } else {
            $v = '${{ github.event.inputs.version }}'
          }
          if ([string]::IsNullOrWhiteSpace($v)) { throw "no version resolved" }
          "version=$v" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "Building webp-tray $v"

      # Decode the PFX from the secret to disk. We deliberately do NOT
      # echo it; setting -OutBuffer / Out-Null keeps base64 out of logs.
      # The PFX is removed at the end of the job in a finally-style step.
      - name: Decode signing PFX
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WEBP_TRAY_SIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            throw "WEBP_TRAY_SIGN_PFX_BASE64 secret is not set; cannot sign release"
          }
          if ([string]::IsNullOrWhiteSpace($env:WEBP_TRAY_SIGN_PFX_PASSWORD)) {
            throw "WEBP_TRAY_SIGN_PFX_PASSWORD secret is not set; cannot sign release"
          }
          [IO.File]::WriteAllBytes(
            $env:WEBP_TRAY_SIGN_PFX,
            [Convert]::FromBase64String($env:PFX_BASE64)
          )
          Write-Host "PFX decoded to $env:WEBP_TRAY_SIGN_PFX ($((Get-Item $env:WEBP_TRAY_SIGN_PFX).Length) bytes)"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: webp-tray

      - name: cargo test
        run: cargo test --release

      - name: Build & sign MSI
        run: ./build-installer.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Verify signatures
        shell: pwsh
        run: |
          $exe = "target\release\webp-tray.exe"
          $msi = "build\webp-tray-${{ steps.ver.outputs.version }}.msi"
          foreach ($f in @($exe, $msi)) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f -> $($sig.Status) ($($sig.SignerCertificate.Subject))"
            # Valid (cert chain trusted on the runner) OR UnknownError
            # (chain not trusted but signature is structurally fine) are both
            # acceptable — we just want to confirm a signer cert is attached.
            if ($sig.Status -notin 'Valid','UnknownError') {
              throw "signature on $f is $($sig.Status): $($sig.StatusMessage)"
            }
            if (-not $sig.SignerCertificate) {
              throw "no signer certificate on $f"
            }
          }

      # Always wipe the decoded PFX even if a prior step failed.
      - name: Clean up PFX
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:WEBP_TRAY_SIGN_PFX) {
            Remove-Item -Force $env:WEBP_TRAY_SIGN_PFX
            Write-Host "removed $env:WEBP_TRAY_SIGN_PFX"
          }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: webp-tray-${{ steps.ver.outputs.version }}-msi
          path: webp-tray/build/webp-tray-${{ steps.ver.outputs.version }}.msi
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/webp-tray-v')
        uses: softprops/action-gh-release@v2
        with:
          name: webp-tray ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: webp-tray/build/webp-tray-${{ steps.ver.outputs.version }}.msi
