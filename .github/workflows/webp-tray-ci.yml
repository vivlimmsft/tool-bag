name: webp-tray ci

# Fast feedback for every push/PR that touches webp-tray. The release workflow
# (webp-tray-release.yml) handles publishing on tag pushes; this one just
# proves the code compiles, tests pass, and the MSI can be assembled.
on:
  push:
    branches: ["**"]
    paths:
      - "webp-tray/**"
      - ".github/workflows/webp-tray-ci.yml"
    tags-ignore:
      - "webp-tray-v*"   # release workflow handles these
  pull_request:
    paths:
      - "webp-tray/**"
      - ".github/workflows/webp-tray-ci.yml"

# Only need read access; we don't publish anything from CI.
permissions:
  contents: read

# If a new commit lands on the same branch/PR while CI is mid-flight, cancel
# the in-flight run — we only care about the latest.
concurrency:
  group: webp-tray-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: webp-tray
        shell: pwsh
    env:
      # CI signs with the same real cert as release. Where the runner-side
      # decoded PFX will land; picked up by sign\sign.ps1 via env.
      WEBP_TRAY_SIGN_PFX: ${{ github.workspace }}\webp-tray\sign\ci.pfx
      WEBP_TRAY_SIGN_PFX_PASSWORD: ${{ secrets.WEBP_TRAY_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: webp-tray

      # Style/correctness gates first — fail fast before the slow MSI build.
      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --release

      # Decode the same PFX the release workflow uses. Secrets aren't
      # available to PRs from forks, so this step (and signing as a whole)
      # will fail those runs — that's the explicit tradeoff the user asked
      # for over the previous ephemeral-cert path.
      - name: Decode signing PFX
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WEBP_TRAY_SIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            throw "WEBP_TRAY_SIGN_PFX_BASE64 secret is not set; cannot sign"
          }
          if ([string]::IsNullOrWhiteSpace($env:WEBP_TRAY_SIGN_PFX_PASSWORD)) {
            throw "WEBP_TRAY_SIGN_PFX_PASSWORD secret is not set; cannot sign"
          }
          [IO.File]::WriteAllBytes(
            $env:WEBP_TRAY_SIGN_PFX,
            [Convert]::FromBase64String($env:PFX_BASE64)
          )
          Write-Host "PFX decoded to $env:WEBP_TRAY_SIGN_PFX ($((Get-Item $env:WEBP_TRAY_SIGN_PFX).Length) bytes)"

      # Smoke-build the MSI with a fixed dummy version. Catches WiX errors,
      # missing assets, and signing breakage before release tag time.
      - name: Build & sign MSI (smoke)
        run: ./build-installer.ps1 -Version "0.0.0-ci"

      - name: Verify signatures
        shell: pwsh
        run: |
          $exe = "target\release\webp-tray.exe"
          $msi = "build\webp-tray-0.0.0-ci.msi"
          foreach ($f in @($exe, $msi)) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f -> $($sig.Status) ($($sig.SignerCertificate.Subject))"
            # Valid (real cert with a trusted chain on the runner) and
            # UnknownError (chain not in the runner's trust store, but
            # signature applied) are both acceptable — we just want to
            # confirm a signer cert is attached.
            if ($sig.Status -notin 'Valid','UnknownError') {
              throw "signature on $f is $($sig.Status): $($sig.StatusMessage)"
            }
            if (-not $sig.SignerCertificate) {
              throw "no signer certificate on $f"
            }
          }

      # Always wipe the decoded PFX even if a prior step failed.
      - name: Clean up PFX
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:WEBP_TRAY_SIGN_PFX) {
            Remove-Item -Force $env:WEBP_TRAY_SIGN_PFX
            Write-Host "removed $env:WEBP_TRAY_SIGN_PFX"
          }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: webp-tray-ci-msi
          path: webp-tray/build/webp-tray-0.0.0-ci.msi
          if-no-files-found: error
          retention-days: 7
